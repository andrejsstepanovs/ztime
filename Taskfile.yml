version: "3"

vars:
  BINARY: ztime
  MODULE:
    sh: go list -m
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"

tasks:
  default:
    desc: Run build, lint, and test (default)
    deps: [build, lint, test]

  build:
    desc: Compile the binary
    cmds:
      - go build -o bin/{{.BINARY}} .
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - bin/{{.BINARY}}

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:unit:
    desc: Run unit tests only (cmd package)
    cmds:
      - go test ./cmd/...

  test:e2e:
    desc: Run e2e tests only
    cmds:
      - go test ./e2e/...

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  lint:fix:
    desc: Run golangci-lint with auto-fix
    cmds:
      - golangci-lint run --fix ./...

  mocks:
    desc: Regenerate mocks using mockery
    cmds:
      - mockery
    sources:
      - internal/store.go
    generates:
      - mocks/mock_Store.go

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  clean:
    desc: Remove build artifacts and coverage report
    cmds:
      - rm -rf bin/ release/ coverage.out

  release:
    desc: Build release binaries for all platforms into ./release/
    vars:
      TARGETS:
        - GOOS=linux   GOARCH=amd64
        - GOOS=linux   GOARCH=arm64
        - GOOS=darwin  GOARCH=amd64
        - GOOS=darwin  GOARCH=arm64
        - GOOS=windows GOARCH=amd64
        - GOOS=windows GOARCH=arm64
    cmds:
      - mkdir -p release
      - |
        for target in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64" "windows/arm64"; do
          os="${target%%/*}"
          arch="${target##*/}"
          out="release/{{.BINARY}}_{{.VERSION}}_${os}_${arch}"
          if [ "$os" = "windows" ]; then out="${out}.exe"; fi
          echo "building $out"
          GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version={{.VERSION}}" -o "$out" .
        done

  ci:
    desc: Full CI pipeline -- tidy, mocks, build, lint, test
    cmds:
      - task: tidy
      - task: mocks
      - task: build
      - task: lint
      - task: test
